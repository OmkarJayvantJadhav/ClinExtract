x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/clinextract
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
  APP_ENV: ${APP_ENV:-development}
  # Required (and enforced) when APP_ENV=production. Generate with: openssl rand -hex 32
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}
  EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-rule_based}
  EXTRACTION_FALLBACK_ENABLED: ${EXTRACTION_FALLBACK_ENABLED:-false}
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_MODEL: ${LLM_MODEL:-}
  VLM_PROVIDER: ${VLM_PROVIDER:-}
  VLM_MODEL: ${VLM_MODEL:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-}
  SQL_ECHO: "false"
  # Optional in development (files are stored unencrypted without it); required in production
  DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:-}
  DOCUMENT_RETENTION_DAYS: ${DOCUMENT_RETENTION_DAYS:-0}
  ALLOW_EXTERNAL_AI_PHI: ${ALLOW_EXTERNAL_AI_PHI:-false}
  METRICS_TOKEN: ${METRICS_TOKEN:-}

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: clinextract
    ports:
      # Bound to localhost only; the database is not reachable from the network
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clin_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    # Apply migrations before serving so a fresh stack is usable immediately
    command: ["sh", "-c", "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    environment:
      <<: *backend-env
      CORS_ORIGINS: '["http://localhost:${FRONTEND_HOST_PORT:-5173}", "http://localhost:3000"]'
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - clin_network
    volumes:
      - documents_data:/app/data/documents
      - artifacts_data:/app/data/artifacts

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      # Localhost only: AMQP and the management UI are not exposed to the network
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_HOST_PORT:-15672}:15672"
    networks:
      - clin_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "src.worker.celery_app", "worker", "--loglevel=info"]
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - clin_network
    volumes:
      - documents_data:/app/data/documents
      - artifacts_data:/app/data/artifacts

  beat:
    # Periodic jobs (document retention purge; a no-op while DOCUMENT_RETENTION_DAYS=0)
    build:
      context: ./backend
    command: ["celery", "-A", "src.worker.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      <<: *backend-env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - clin_network

  frontend:
    # Development server (hot reload). For production, build static assets with
    # `npm run build` and serve frontend/dist from a web server instead.
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_HOST_PORT:-8001}/api/v1}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - clin_network

networks:
  clin_network:

volumes:
  postgres_data:
  documents_data:
  artifacts_data:
