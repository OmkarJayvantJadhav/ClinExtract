name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinextract_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/clinextract_test
      STORAGE_DIR: ${{ github.workspace }}/.ci-data/documents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System packages (OCR)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng libmagic1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Migrations apply cleanly to an empty database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE clinextract_migrations"
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/clinextract_migrations alembic upgrade head
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/clinextract_migrations alembic downgrade base
      - name: Tests
        run: pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t clinextract-backend ./backend
      - name: Build production web image
        run: docker build -f frontend/Dockerfile.prod -t clinextract-web ./frontend
      - name: Validate production compose file
        env:
          SITE_ADDRESS: example.org
          POSTGRES_PASSWORD: x
          RABBITMQ_USER: x
          RABBITMQ_PASSWORD: x
          JWT_SECRET: x
          DOCUMENT_ENCRYPTION_KEY: x
        run: docker compose -f docker-compose.prod.yml config --quiet
